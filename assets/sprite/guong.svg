<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="192" height="192">
  <!-- Gương: bẻ tia sét 90°. Đặt chéo vì đường chéo là ký hiệu phản xạ ai cũng
       đọc được. Khung sẫm lộ ở CẢ HAI cạnh dài, nếu không nó chỉ ra viên nhộng. -->
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".34" stop-color="#cfe9f7"/>
      <stop offset=".36" stop-color="#7fb3cf"/>
      <stop offset=".62" stop-color="#b9dcef"/>
      <stop offset=".64" stop-color="#5a8299"/>
      <stop offset="1" stop-color="#3d5f73"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-45 32 32)">
    <!-- khung -->
    <rect x="4" y="24" width="56" height="17" rx="4" fill="#1e2a34"/>
    <!-- mặt gương, chừa viền khung đều hai bên -->
    <rect x="7" y="27" width="50" height="11" rx="2.6" fill="url(#mat)"/>
    <!-- vệt loé chạy dọc mép trên -->
    <rect x="10" y="28.4" width="22" height="2.2" rx="1.1" fill="#fff" opacity=".85"/>
    <!-- hai chốt giữ ở đầu khung -->
    <circle cx="8.5" cy="32.5" r="2.1" fill="#59697a"/>
    <circle cx="55.5" cy="32.5" r="2.1" fill="#59697a"/>
  </g>
</svg>
