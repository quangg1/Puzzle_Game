    <rect x="4" y="34.5" width="7.5" height="10.5" rx="2.2"/>
    <rect x="52.5" y="19" width="7.5" height="10.5" rx="2.2"/>
    <rect x="52.5" y="34.5" width="7.5" height="10.5" rx="2.2"/>
  </g>
