<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thử móc câu — 4 cơ chế</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0e12; color: #7d8794; padding: 28px 20px 48px;
    font: 14px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  header { max-width: 980px; margin: 0 auto 26px; }
  h1 { color: #e8ecf2; font-size: 19px; margin: 0 0 6px; font-weight: 600; }
  header p { margin: 0; max-width: 62ch; }
  #bang {
    max-width: 980px; margin: 0 auto; display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  }
  .o {
    background: #11151b; border: 1px solid #1b212a; border-radius: 6px;
    padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .o canvas { width: 100%; height: auto; display: block; border-radius: 4px; background: #0e1217; }
  .ten { color: #e8ecf2; font-size: 15px; font-weight: 600; }
  .luat { font-size: 13px; line-height: 1.55; min-height: 3.1em; }
  .so { font-size: 12px; color: #4e5765; letter-spacing: .03em; }
</style>
</head>
<body>
<header>
  <h1>Thử móc câu — 4 cơ chế</h1>
  <p>Phép thử: nhìn 5 giây, có hiểu luật không, và có muốn thử không. Chấm bằng mắt, đừng đọc chữ trước.</p>
</header>
<div id="bang"></div>

<script>
const muot = (t) => (t < .5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2);
const kep = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const NEN = '#0e1217', SAN = '#1a212b', VIEN = '#262f3c';
const NGUOI = '#e8ecf2', AM = '#e2b06a', HOP = '#5d7290';

function luoi(ctx, W, H, cot, hang, le = .86) {
  const o = Math.min((W * le) / cot, (H * le) / hang);
  return { o, x0: (W - cot * o) / 2, y0: (H - hang * o) / 2 };
}
function veSan(ctx, g, cot, hang) {
  ctx.fillStyle = SAN;
  ctx.strokeStyle = VIEN;
  ctx.lineWidth = 1;
  for (let y = 0; y < hang; y++)
    for (let x = 0; x < cot; x++) {
      const px = g.x0 + x * g.o, py = g.y0 + y * g.o;
      ctx.fillRect(px, py, g.o - 1, g.o - 1);
      ctx.strokeRect(px + .5, py + .5, g.o - 2, g.o - 2);
    }
}
function veNguoi(ctx, px, py, r, mau = NGUOI, mo = 1) {
  ctx.globalAlpha = mo;
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(px, py + r * .95, r * .8, r * .3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = mau;
  ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.arc(px, py - r * .34, r * .42, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

const CO_CHE = [

// ───────────────────────────────────────────────────────────────── 1
{
  ten: 'Bạn là cái lỗ',
  luat: 'Bạn không điều khiển nhân vật — bạn điều khiển một cái lỗ trên sàn. Thứ gì rơi vào cũng mất, và mỗi lần nuốt thì lỗ to thêm.',
  chuKy: 5600,
  ve(ctx, W, H, t) {
    const cot = 6, hang = 3, g = luoi(ctx, W, H, cot, hang);
    veSan(ctx, g, cot, hang);
    const nhip = 850, hangLo = 1;
    const b = Math.floor(t / nhip);
    const trong = muot(kep((t % nhip) / (nhip * .62), 0, 1));
    const xLo = kep(b + trong, 0, cot - 1);
    const giua = (c) => g.x0 + c * g.o + g.o / 2;
    const cyLo = g.y0 + hangLo * g.o + g.o / 2;

    // hộp — nuốt dần khi lỗ đi qua
    let daAn = 0;
    for (const c of [1, 3, 5]) {
      const an = kep((xLo - c + .55) / .55, 0, 1);
      daAn += an;
      if (an >= 1) continue;
      const s = (1 - an) * g.o * .46;
      const hx = lerp(giua(c), giua(xLo), an * .8);
      const hy = lerp(cyLo, cyLo + g.o * .18, an);
      ctx.fillStyle = HOP;
      ctx.fillRect(hx - s / 2, hy - s / 2, s, s);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fillRect(hx - s / 2, hy - s / 2, s, s * .26);
    }

    const r = g.o * (.2 + daAn * .075);
    const toa = ctx.createRadialGradient(giua(xLo), cyLo, r * .55, giua(xLo), cyLo, r * 1.5);
    toa.addColorStop(0, 'rgba(0,0,0,.6)'); toa.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = toa;
    ctx.beginPath(); ctx.arc(giua(xLo), cyLo, r * 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#05070a';
    ctx.beginPath(); ctx.arc(giua(xLo), cyLo, r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(232,236,242,.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(giua(xLo), cyLo, r, 0, 7); ctx.stroke();
  },
},

// ───────────────────────────────────────────────────────────────── 2
{
  ten: 'Một trục là thời gian',
  luat: 'Đi ngang là đi trong không gian. Đi dọc là đi trong thời gian — xuống là lát sau, lên là quay về lúc trước, nơi bản thân cũ vẫn đang đứng.',
  chuKy: 6300,
  ve(ctx, W, H, t) {
    const cot = 5, hang = 4, g = luoi(ctx, W, H, cot, hang, .78);
    g.x0 += g.o * .34;
    veSan(ctx, g, cot, hang);

    ctx.fillStyle = '#39424f';
    ctx.font = `600 ${Math.round(g.o * .3)}px ui-sans-serif, system-ui`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let y = 0; y < hang; y++)
      ctx.fillText(`lúc ${y + 1}`, g.x0 - g.o * .22, g.y0 + y * g.o + g.o / 2);

    const buoc = [[0,0],[1,0],[2,0],[2,1],[3,1],[3,2],[3,1],[3,1]];
    const ma = [[3,2,0],[5,3,1]];   // [hiện từ nhịp, x, y]
    const nhip = 780;
    const i = Math.min(Math.floor(t / nhip), buoc.length - 2);
    const p = muot(kep((t % nhip) / (nhip * .62), 0, 1));
    const px = lerp(buoc[i][0], buoc[i + 1][0], p);
    const py = lerp(buoc[i][1], buoc[i + 1][1], p);
    const giua = (c) => g.x0 + c * g.o + g.o / 2;
    const dong = (r) => g.y0 + r * g.o + g.o / 2;

    for (const [tu, mx, my] of ma) {
      if (i < tu) continue;
      const trung = Math.abs(px - mx) < .12 && Math.abs(py - my) < .12;
      if (trung) {
        ctx.fillStyle = 'rgba(226,176,106,.2)';
        ctx.beginPath(); ctx.arc(giua(mx), dong(my), g.o * .44, 0, 7); ctx.fill();
      }
      veNguoi(ctx, giua(mx), dong(my), g.o * .26, trung ? AM : NGUOI, trung ? .8 : .3);
    }
    veNguoi(ctx, giua(px), dong(py), g.o * .28);
  },
},

// ───────────────────────────────────────────────────────────────── 3
(() => {
  const N = 5;
  const quay = (ds) => ds.map((v) => ({ ...v, c: N - 1 - v.r, r: v.c }));   // 90° thuận kim đồng hồ
  const roi = (ds) => {                                                     // xếp chồng từ đáy theo cột
    const cot = new Map();
    for (const v of ds) { if (!cot.has(v.c)) cot.set(v.c, []); cot.get(v.c).push(v); }
    const ra = [];
    for (const ds2 of cot.values()) {
      ds2.sort((a, b) => b.r - a.r);
      let day = N - 1;
      for (const v of ds2) ra.push({ ...v, r: day-- });
    }
    return ra;
  };
  const dau = (ds) => ds.map((v) => `${v.id}:${v.c},${v.r}`).sort().join('|');

  // chạy tới khi trạng thái lặp lại, rồi chỉ dùng đúng chu kỳ đó — vòng lặp không giật
  let s = [
    { id: 0, c: 1, r: 4, loai: 'hop' }, { id: 1, c: 2, r: 4, loai: 'hop' },
    { id: 2, c: 3, r: 4, loai: 'hop' }, { id: 3, c: 2, r: 3, loai: 'nguoi' },
  ];
  const day = [], thay = new Map();
  while (!thay.has(dau(s))) { thay.set(dau(s), day.length); day.push(s); s = roi(quay(s)); }
  const VONG = day.slice(thay.get(dau(s)));

  return {
    ten: 'Mỗi nước, cả thế giới xoay',
    luat: 'Bạn đi một bước, bàn cờ quay 90 độ. Mọi thứ rơi xuống theo chiều "dưới" vừa đổi — kể cả bạn.',
    chuKy: VONG.length * 1500,
    ve(ctx, W, H, t) {
      const g = luoi(ctx, W, H, N, N, .82);
      const nhip = 1500;
      const b = Math.floor(t / nhip) % VONG.length;
      const trong = (t % nhip) / nhip;
      const truocDo = VONG[b];                       // đã đứng yên
      const sauDo = VONG[(b + 1) % VONG.length];     // sau khi quay và rơi xong
      const giuaChung = quay(truocDo);               // quay xong, chưa rơi

      const oX = (c) => g.x0 + c * g.o + g.o / 2;
      const oY = (r) => g.y0 + r * g.o + g.o / 2;
      const tx = g.x0 + (N * g.o) / 2, ty = g.y0 + (N * g.o) / 2;
      const veVat = (v, x, y) => {
        if (v.loai === 'nguoi') return veNguoi(ctx, x, y, g.o * .27);
        const k = g.o * .5;
        ctx.fillStyle = HOP; ctx.fillRect(x - k / 2, y - k / 2, k, k);
        ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x - k / 2, y - k / 2, k, k * .26);
      };

      if (trong < .55) {
        const xoay = muot(trong / .55) * Math.PI / 2;
        ctx.save();
        ctx.translate(tx, ty); ctx.rotate(xoay); ctx.translate(-tx, -ty);
        veSan(ctx, g, N, N);
        for (const v of truocDo) veVat(v, oX(v.c), oY(v.r));   // đồ quay cùng bàn
        ctx.restore();
      } else {
        veSan(ctx, g, N, N);
        const p = muot(kep((trong - .58) / .42, 0, 1));
        const dich = new Map(sauDo.map((v) => [v.id, v]));
        for (const v of giuaChung) {
          const d = dich.get(v.id);
          veVat(v, oX(lerp(v.c, d.c, p)), oY(lerp(v.r, d.r, p)));
        }
      }

      ctx.strokeStyle = 'rgba(226,176,106,.5)';
      ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const ax = g.x0 + N * g.o + g.o * .3;
      ctx.beginPath();
      ctx.moveTo(ax, ty - g.o * .42); ctx.lineTo(ax, ty + g.o * .42);
      ctx.moveTo(ax - g.o * .16, ty + g.o * .24); ctx.lineTo(ax, ty + g.o * .42);
      ctx.lineTo(ax + g.o * .16, ty + g.o * .24);
      ctx.stroke();
    },
  };
})(),

// ───────────────────────────────────────────────────────────────── 4
{
  ten: 'Gặp ngã rẽ là tách đôi',
  luat: 'Một phím điều khiển tất cả. Tới ngã rẽ, bạn không chọn — bạn tách làm đôi và đi cả hai lối. Phải đưa mọi bản thân về đích.',
  chuKy: 4900,
  ve(ctx, W, H, t) {
    const goc = [W * .5, H * .1];
    const nga = [W * .5, H * .38];
    const m1 = [[W * .26, H * .62], [W * .74, H * .62]];
    const m2 = [[W * .12, H * .88], [W * .4, H * .88], [W * .6, H * .88], [W * .88, H * .88]];

    ctx.strokeStyle = SAN;
    ctx.lineWidth = Math.max(9, W * .042);
    ctx.lineCap = 'round';
    const noi = (a, b) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); };
    noi(goc, nga);
    m1.forEach((p, i) => { noi(nga, p); noi(p, m2[i * 2]); noi(p, m2[i * 2 + 1]); });

    const r = W * .034;
    const a = muot(kep(t / 1100, 0, 1));             // gốc → ngã rẽ
    const b = muot(kep((t - 1300) / 1100, 0, 1));    // tách đôi
    const c = muot(kep((t - 2600) / 1100, 0, 1));    // tách bốn
    const sang = kep((t - 3600) / 600, 0, 1);

    ctx.fillStyle = `rgba(226,176,106,${.12 + sang * .22})`;
    for (const p of m2) { ctx.beginPath(); ctx.arc(p[0], p[1], W * .046, 0, 7); ctx.fill(); }

    if (c > 0) {
      m1.forEach((p, i) => {
        for (const d of [m2[i * 2], m2[i * 2 + 1]])
          veNguoi(ctx, lerp(p[0], d[0], c), lerp(p[1], d[1], c), r, sang > .5 ? AM : NGUOI);
      });
    } else if (b > 0) {
      for (const p of m1) veNguoi(ctx, lerp(nga[0], p[0], b), lerp(nga[1], p[1], b), r);
    } else {
      veNguoi(ctx, lerp(goc[0], nga[0], a), lerp(goc[1], nga[1], a), r);
    }
  },
},
];

// ── dựng khung ──────────────────────────────────────────────────────────────
const bang = document.getElementById('bang');
const tam = [];
CO_CHE.forEach((c, i) => {
  const o = document.createElement('div');
  o.className = 'o';
  o.innerHTML = `<div class="ten">${i + 1}. ${c.ten}</div>
    <canvas></canvas>
    <div class="luat">${c.luat}</div>`;
  bang.appendChild(o);
  const cv = o.querySelector('canvas');
  tam.push({ c, cv, ctx: cv.getContext('2d') });
});

function doKichThuoc() {
  for (const p of tam) {
    const r = p.cv.getBoundingClientRect();
    const tl = devicePixelRatio || 1;
    p.cv.width = Math.round(r.width * tl);
    p.cv.height = Math.round(r.width * .72 * tl);
    p.cv.style.height = `${Math.round(r.width * .72)}px`;
    p.tl = tl;
  }
}
addEventListener('resize', doKichThuoc);

function khung(nay) {
  for (const p of tam) {
    const W = p.cv.width / p.tl, H = p.cv.height / p.tl;
    p.ctx.setTransform(p.tl, 0, 0, p.tl, 0, 0);
    p.ctx.fillStyle = NEN;
    p.ctx.fillRect(0, 0, W, H);
    p.c.ve(p.ctx, W, H, nay % p.c.chuKy);
  }
  requestAnimationFrame(khung);
}
doKichThuoc();
requestAnimationFrame(khung);
</script>
</body>
</html>
